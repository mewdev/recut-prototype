<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Phrase Comparison: MUF vs Map</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: monospace; background: #0f0f0f; color: #e0e0e0; padding: 24px; }
  h1 { font-size: 13px; color: #555; margin-bottom: 20px; }

  .load-row { display: flex; gap: 12px; margin-bottom: 24px; }
  .load-box {
    flex: 1; border: 1px dashed #333; padding: 12px;
    text-align: center; cursor: pointer; font-size: 12px; color: #555;
  }
  .load-box.loaded { border-color: #444; color: #aaa; }
  .load-box input { display: none; }

  #viz { display: none; }

  /* Legend */
  .legend { display: flex; gap: 16px; font-size: 11px; margin-bottom: 16px; }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .swatch { width: 12px; height: 12px; border-radius: 2px; }
  .sw-muf  { background: #2d6ea8; }
  .sw-map  { background: #2d7a4a; }
  .sw-match { background: #7a6a2d; }

  /* Track */
  .track-label { font-size: 10px; color: #555; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px; }
  .track {
    position: relative; height: 28px;
    background: #141414; border-radius: 3px;
    margin-bottom: 2px; overflow: visible;
  }
  .track-spacer { height: 12px; }

  .phrase-block {
    position: absolute; top: 2px; bottom: 2px;
    border-radius: 2px;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; overflow: hidden;
    cursor: pointer;
    border: 1px solid transparent;
    transition: opacity 0.1s;
  }
  .phrase-block:hover { opacity: 0.7; z-index: 10; }
  .phrase-block.muf  { background: #1e4a72; border-color: #2d6ea8; color: #6aa8d8; }
  .phrase-block.map  { background: #1e4a2d; border-color: #2d7a4a; color: #6ab88a; }
  .phrase-block.match-muf { background: #4a3a1e; border-color: #7a6a2d; color: #c8a84a; }
  .phrase-block.match-map { background: #3a2e1a; border-color: #6a5a24; color: #b89840; }

  /* Ruler */
  .ruler { position: relative; height: 18px; margin-bottom: 24px; }
  .ruler-tick { position: absolute; font-size: 9px; color: #333; transform: translateX(-50%); }

  /* Segment overlay */
  .seg-overlay { position: relative; height: 10px; background: #141414; border-radius: 2px; margin-bottom: 2px; overflow: hidden; }
  .seg-mini {
    position: absolute; top: 0; bottom: 0;
    opacity: 0.6;
    border-right: 1px solid #0f0f0f;
  }
  .label-intro    { background: #2d4a6e; }
  .label-verse    { background: #2d5a3d; }
  .label-pre-chorus { background: #5a4a2d; }
  .label-chorus   { background: #6e2d2d; }
  .label-bridge   { background: #4a2d6e; }
  .label-inst     { background: #2d5a5a; }
  .label-outro    { background: #3a3a3a; }
  .label-silence  { background: #1a1a1a; }
  .label-interlude { background: #3d3a2d; }
  .label-ending   { background: #3a2d2d; }

  /* Stats */
  #stats { font-size: 11px; color: #666; margin-bottom: 20px; }
  #stats span { color: #aaa; }

  /* Tooltip */
  #tooltip {
    position: fixed; background: #1a1a1a; border: 1px solid #333;
    padding: 6px 10px; font-size: 11px; border-radius: 3px;
    pointer-events: none; display: none; z-index: 100;
  }
</style>
</head>
<body>
<h1>phrase comparison — MUF vs map</h1>

<div class="load-row">
  <label class="load-box" id="box-map">
    drop map JSON (our output)
    <input type="file" id="file-map" accept=".json">
  </label>
</div>

<div id="viz">
  <div class="legend">
    <div class="legend-item"><div class="swatch sw-muf"></div> MUF phrases (29)</div>
    <div class="legend-item"><div class="swatch sw-map"></div> Our phrases</div>
    <div class="legend-item"><div class="swatch sw-match"></div> match (±0.5s)</div>
  </div>

  <div id="stats"></div>

  <div class="track-label">segments</div>
  <div class="seg-overlay" id="seg-overlay"></div>

  <div class="track-spacer"></div>
  <div class="track-label">MUF (29 phrases)</div>
  <div class="track" id="track-muf"></div>

  <div class="track-spacer"></div>
  <div class="track-label">our map</div>
  <div class="track" id="track-map"></div>

  <div class="ruler" id="ruler"></div>
</div>

<div id="tooltip"></div>

<script>
// MUF phrases hardcoded (extracted from end_of_beginning.json, timescale 44100)
const MUF_PHRASES = [
  {start:0.093,end:3.100},{start:3.100,end:9.102},{start:9.102,end:15.101},
  {start:15.101,end:21.103},{start:21.103,end:27.102},{start:27.102,end:30.104},
  {start:30.104,end:36.100},{start:36.100,end:42.100},{start:42.100,end:48.099},
  {start:48.099,end:54.095},{start:54.095,end:60.096},{start:60.096,end:66.101},
  {start:66.101,end:72.100},{start:72.100,end:79.440},{start:79.440,end:82.603},
  {start:82.603,end:88.599},{start:88.599,end:94.600},{start:94.600,end:97.604},
  {start:97.604,end:103.604},{start:103.604,end:109.602},{start:109.602,end:115.601},
  {start:115.601,end:121.600},{start:121.600,end:124.601},{start:124.601,end:133.611},
  {start:133.611,end:139.597},{start:139.597,end:145.599},{start:145.599,end:151.606},
  {start:151.606,end:157.609},{start:157.609,end:159.299}
];

const MATCH_THRESHOLD = 0.5; // seconds

let mapData = null;

// File loading
document.getElementById('file-map').addEventListener('change', e => {
  const reader = new FileReader();
  reader.onload = ev => {
    mapData = JSON.parse(ev.target.result);
    document.getElementById('box-map').classList.add('loaded');
    document.getElementById('box-map').textContent = mapData.path.split('/').pop();
    render();
  };
  reader.readAsText(e.target.files[0]);
});
document.getElementById('box-map').addEventListener('click', e => {
  document.getElementById('file-map').click();
});

function getMapPhrases(data) {
  const phrases = [];
  data.segments.forEach(seg => {
    seg.phrases.forEach((start, i) => {
      const nextPhrase = seg.phrases[i + 1];
      const end = nextPhrase !== undefined ? nextPhrase : seg.end;
      const displayStart = i === 0 ? seg.start : start;
      phrases.push({ start: displayStart, end, segLabel: seg.label });
    });
  });
  return phrases;
}

function isMatch(a, b) {
  return Math.abs(a.start - b.start) <= MATCH_THRESHOLD;
}

function render() {
  if (!mapData) return;

  const dur = mapData.duration;
  const mapPhrases = getMapPhrases(mapData);

  // Find matches
  const mufMatched = new Set();
  const mapMatched = new Set();
  MUF_PHRASES.forEach((mp, mi) => {
    mapPhrases.forEach((op, oi) => {
      if (isMatch(mp, op)) { mufMatched.add(mi); mapMatched.add(oi); }
    });
  });

  // Stats
  const matchCount = mufMatched.size;
  document.getElementById('stats').innerHTML =
    `MUF: <span>${MUF_PHRASES.length}</span> phrases &nbsp;|&nbsp; ` +
    `ours: <span>${mapPhrases.length}</span> phrases &nbsp;|&nbsp; ` +
    `matches (±${MATCH_THRESHOLD}s): <span>${matchCount}</span> / ${MUF_PHRASES.length} ` +
    `(<span>${Math.round(matchCount/MUF_PHRASES.length*100)}%</span>)`;

  // Segment overlay
  const segOverlay = document.getElementById('seg-overlay');
  segOverlay.innerHTML = '';
  mapData.segments.forEach(seg => {
    const el = document.createElement('div');
    el.className = `seg-mini label-${seg.label}`;
    el.style.left = pct(seg.start, dur);
    el.style.width = pct(seg.end - seg.start, dur);
    el.title = seg.label;
    segOverlay.appendChild(el);
  });

  // MUF track
  const trackMuf = document.getElementById('track-muf');
  trackMuf.innerHTML = '';
  MUF_PHRASES.forEach((p, i) => {
    const el = document.createElement('div');
    el.className = `phrase-block muf${mufMatched.has(i) ? ' match-muf' : ''}`;
    el.style.left = pct(p.start, dur);
    el.style.width = pct(p.end - p.start, dur);
    el.textContent = i + 1;
    addTooltip(el, `MUF #${i+1}  ${p.start.toFixed(2)}s – ${p.end.toFixed(2)}s  (${(p.end-p.start).toFixed(2)}s)`);
    trackMuf.appendChild(el);
  });

  // Map track
  const trackMap = document.getElementById('track-map');
  trackMap.innerHTML = '';
  mapPhrases.forEach((p, i) => {
    const el = document.createElement('div');
    el.className = `phrase-block map${mapMatched.has(i) ? ' match-map' : ''}`;
    el.style.left = pct(p.start, dur);
    el.style.width = pct(p.end - p.start, dur);
    el.textContent = i + 1;
    addTooltip(el, `Map #${i+1}  ${p.start.toFixed(2)}s – ${p.end.toFixed(2)}s  (${(p.end-p.start).toFixed(2)}s) [${p.segLabel}]`);
    trackMap.appendChild(el);
  });

  // Ruler
  const ruler = document.getElementById('ruler');
  ruler.innerHTML = '';
  for (let t = 0; t <= dur; t += 15) {
    const tick = document.createElement('div');
    tick.className = 'ruler-tick';
    tick.style.left = pct(t, dur);
    tick.textContent = `${t}s`;
    ruler.appendChild(tick);
  }

  document.getElementById('viz').style.display = 'block';
}

function pct(val, total) { return (val / total * 100) + '%'; }

const tooltip = document.getElementById('tooltip');
function addTooltip(el, text) {
  el.addEventListener('mouseenter', e => {
    tooltip.textContent = text;
    tooltip.style.display = 'block';
  });
  el.addEventListener('mousemove', e => {
    tooltip.style.left = (e.clientX + 12) + 'px';
    tooltip.style.top = (e.clientY + 12) + 'px';
  });
  el.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });
}
</script>
</body>
</html>
