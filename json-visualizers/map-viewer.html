<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Music Map Viewer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: monospace; background: #0f0f0f; color: #e0e0e0; padding: 20px; }
  h1 { font-size: 14px; color: #888; margin-bottom: 16px; }

  #drop-zone {
    border: 1px dashed #333;
    padding: 20px;
    text-align: center;
    color: #555;
    margin-bottom: 20px;
    cursor: pointer;
    font-size: 13px;
  }
  #drop-zone.drag-over { border-color: #666; color: #aaa; }
  #file-input { display: none; }

  #meta { display: flex; gap: 24px; margin-bottom: 20px; font-size: 12px; color: #888; }
  #meta span { color: #ddd; }

  /* Timeline */
  #timeline-wrap { margin-bottom: 24px; }
  #timeline {
    position: relative;
    height: 48px;
    background: #1a1a1a;
    border-radius: 4px;
    overflow: hidden;
  }
  .seg-block {
    position: absolute;
    top: 0; bottom: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    font-weight: bold;
    color: rgba(255,255,255,0.85);
    overflow: hidden;
    cursor: pointer;
    border-right: 1px solid #0f0f0f;
    transition: opacity 0.1s;
  }
  .seg-block:hover { opacity: 0.8; }
  .seg-block.active { outline: 2px solid #fff; z-index: 10; }

  /* Segment colors */
  .label-intro    { background: #2d4a6e; }
  .label-verse    { background: #2d5a3d; }
  .label-pre-chorus { background: #5a4a2d; }
  .label-chorus   { background: #6e2d2d; }
  .label-bridge   { background: #4a2d6e; }
  .label-inst     { background: #2d5a5a; }
  .label-outro    { background: #3a3a3a; }
  .label-silence  { background: #1a1a1a; }
  .label-interlude { background: #3d3a2d; }
  .label-ending   { background: #3a2d2d; }

  /* Time ruler */
  #ruler { position: relative; height: 16px; margin-top: 2px; }
  .ruler-tick { position: absolute; font-size: 9px; color: #444; transform: translateX(-50%); }

  /* Detail panel */
  #detail { display: none; }
  #detail-header {
    display: flex; align-items: baseline; gap: 12px;
    margin-bottom: 12px;
  }
  #detail-label { font-size: 18px; font-weight: bold; }
  #detail-timing { font-size: 12px; color: #666; }

  .detail-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    margin-bottom: 16px;
  }
  .detail-section h3 { font-size: 10px; color: #555; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }

  /* Chord timeline */
  #chord-timeline {
    position: relative;
    height: 32px;
    background: #1a1a1a;
    border-radius: 3px;
    overflow: hidden;
    margin-bottom: 16px;
  }
  .chord-block {
    position: absolute;
    top: 0; bottom: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 10px;
    color: rgba(255,255,255,0.9);
    border-right: 1px solid #0f0f0f;
    background: #2a4a6a;
    overflow: hidden;
    white-space: nowrap;
  }
  .chord-block.chord-N { background: #1e1e1e; color: #444; }

  /* Phrases / downbeats */
  .beat-list { display: flex; flex-wrap: wrap; gap: 4px; }
  .beat-pill {
    background: #1e1e1e;
    border: 1px solid #333;
    border-radius: 3px;
    padding: 2px 6px;
    font-size: 10px;
    color: #aaa;
  }
  .beat-pill.phrase { border-color: #555; color: #ddd; }

  .loudness-bar-wrap { margin-top: 4px; }
  .loudness-label { font-size: 10px; color: #666; margin-bottom: 2px; }
  .loudness-bar {
    height: 8px;
    background: #1a1a1a;
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 4px;
  }
  .loudness-fill { height: 100%; background: #3d7a3d; border-radius: 2px; }
</style>
</head>
<body>
<h1>music map viewer</h1>

<div id="drop-zone" onclick="document.getElementById('file-input').click()">
  drop map JSON here or click to open
  <input type="file" id="file-input" accept=".json">
</div>

<div id="meta" style="display:none">
  <div>path <span id="m-path">—</span></div>
  <div>bpm <span id="m-bpm">—</span></div>
  <div>key <span id="m-key">—</span></div>
  <div>time <span id="m-time">—</span></div>
  <div>duration <span id="m-dur">—</span></div>
</div>

<div id="timeline-wrap" style="display:none">
  <div id="timeline"></div>
  <div id="ruler"></div>
</div>

<div id="detail">
  <div id="detail-header">
    <div id="detail-label"></div>
    <div id="detail-timing"></div>
  </div>

  <div id="chord-timeline"></div>

  <div class="detail-grid">
    <div class="detail-section">
      <h3>Downbeats (bars)</h3>
      <div class="beat-list" id="detail-downbeats"></div>
    </div>
    <div class="detail-section">
      <h3>Phrases (2-bar)</h3>
      <div class="beat-list" id="detail-phrases"></div>
    </div>
  </div>

  <div class="detail-section">
    <h3>Loudness</h3>
    <div class="loudness-bar-wrap">
      <div class="loudness-label">overall <span id="l-overall"></span> dB</div>
      <div class="loudness-bar"><div class="loudness-fill" id="l-overall-bar"></div></div>
      <div class="loudness-label">start <span id="l-start"></span> dB</div>
      <div class="loudness-bar"><div class="loudness-fill" id="l-start-bar"></div></div>
      <div class="loudness-label">end <span id="l-end"></span> dB</div>
      <div class="loudness-bar"><div class="loudness-fill" id="l-end-bar"></div></div>
    </div>
  </div>
</div>

<script>
let mapData = null;

// File loading
document.getElementById('file-input').addEventListener('change', e => {
  loadFile(e.target.files[0]);
});

const dropZone = document.getElementById('drop-zone');
dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
dropZone.addEventListener('drop', e => {
  e.preventDefault();
  dropZone.classList.remove('drag-over');
  loadFile(e.dataTransfer.files[0]);
});

function loadFile(file) {
  const reader = new FileReader();
  reader.onload = e => renderMap(JSON.parse(e.target.result));
  reader.readAsText(file);
}

function renderMap(data) {
  mapData = data;
  const dur = data.duration;

  // Meta
  document.getElementById('m-path').textContent = data.path.split('/').pop();
  document.getElementById('m-bpm').textContent = data.bpm;
  document.getElementById('m-key').textContent = data.key ? `${data.key.tonic} ${data.key.mode}` : '—';
  document.getElementById('m-time').textContent = data.time_signature;
  document.getElementById('m-dur').textContent = `${dur.toFixed(1)}s`;
  document.querySelector('#meta').style.display = 'flex';

  // Timeline
  const timeline = document.getElementById('timeline');
  timeline.innerHTML = '';
  data.segments.forEach(seg => {
    const block = document.createElement('div');
    block.className = `seg-block label-${seg.label}`;
    block.style.left = `${(seg.start / dur) * 100}%`;
    block.style.width = `${((seg.end - seg.start) / dur) * 100}%`;
    block.textContent = seg.label;
    block.title = `${seg.label} ${seg.start.toFixed(1)}s–${seg.end.toFixed(1)}s`;
    block.addEventListener('click', () => showSegment(seg));
    timeline.appendChild(block);
  });

  // Ruler — every 15s
  const ruler = document.getElementById('ruler');
  ruler.innerHTML = '';
  for (let t = 0; t <= dur; t += 15) {
    const tick = document.createElement('div');
    tick.className = 'ruler-tick';
    tick.style.left = `${(t / dur) * 100}%`;
    tick.textContent = `${t}s`;
    ruler.appendChild(tick);
  }

  document.getElementById('timeline-wrap').style.display = 'block';
  dropZone.style.display = 'none';

  // Auto-select first segment
  if (data.segments.length > 0) showSegment(data.segments[0]);
}

function showSegment(seg) {
  // Highlight active block
  document.querySelectorAll('.seg-block').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.seg-block').forEach(b => {
    if (b.title.startsWith(seg.label + ' ' + seg.start.toFixed(1))) b.classList.add('active');
  });

  // Header
  document.getElementById('detail-label').textContent = `#${seg.index} ${seg.label}`;
  document.getElementById('detail-timing').textContent =
    `${seg.start.toFixed(2)}s – ${seg.end.toFixed(2)}s · ${seg.duration.toFixed(1)}s · ${seg.bars} bars`;

  // Chord timeline
  const ct = document.getElementById('chord-timeline');
  ct.innerHTML = '';
  const segDur = seg.end - seg.start;
  seg.chords.forEach(c => {
    const cStart = Math.max(c.start, seg.start);
    const cEnd = Math.min(c.end, seg.end);
    const block = document.createElement('div');
    block.className = `chord-block${c.chord === 'N' ? ' chord-N' : ''}`;
    block.style.left = `${((cStart - seg.start) / segDur) * 100}%`;
    block.style.width = `${((cEnd - cStart) / segDur) * 100}%`;
    block.textContent = c.chord === 'N' ? '—' : c.chord.replace(':', ' ');
    block.title = `${c.chord} ${c.start.toFixed(2)}s–${c.end.toFixed(2)}s`;
    ct.appendChild(block);
  });

  // Downbeats
  const db = document.getElementById('detail-downbeats');
  db.innerHTML = '';
  const phraseSet = new Set(seg.phrases.map(p => p.toFixed(2)));
  seg.downbeats.forEach(t => {
    const pill = document.createElement('div');
    pill.className = 'beat-pill' + (phraseSet.has(t.toFixed(2)) ? ' phrase' : '');
    pill.textContent = t.toFixed(2);
    db.appendChild(pill);
  });

  // Phrases
  const ph = document.getElementById('detail-phrases');
  ph.innerHTML = '';
  seg.phrases.forEach(t => {
    const pill = document.createElement('div');
    pill.className = 'beat-pill phrase';
    pill.textContent = t.toFixed(2);
    ph.appendChild(pill);
  });

  // Loudness — map -60..0 dB to 0..100%
  function dbToPercent(db) { return Math.max(0, Math.min(100, (db + 60) / 60 * 100)); }
  document.getElementById('l-overall').textContent = seg.loudness_db.toFixed(1);
  document.getElementById('l-overall-bar').style.width = dbToPercent(seg.loudness_db) + '%';
  document.getElementById('l-start').textContent = seg.loudness_db_start.toFixed(1);
  document.getElementById('l-start-bar').style.width = dbToPercent(seg.loudness_db_start) + '%';
  document.getElementById('l-end').textContent = seg.loudness_db_end.toFixed(1);
  document.getElementById('l-end-bar').style.width = dbToPercent(seg.loudness_db_end) + '%';

  document.getElementById('detail').style.display = 'block';
}
</script>
</body>
</html>
