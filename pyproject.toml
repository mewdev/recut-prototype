[project]
name = "recut"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "librosa",
    "scipy",
    "pedalboard",
    "modal[api-proxy-support]<1.7",  # extra: Modal honors HTTPS_PROXY (sandboxes, cloud) and needs python-socks for it. 1.7 refuses Python 3.10 images: lift after the pipeline images move to 3.11 (STATUS M5)
    "pydantic",
    "soundfile",
    "fastapi",
    "uvicorn",
    "python-multipart",
    "pyloudnorm",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "httpx"]
qc = ['essentia; sys_platform != "darwin" or platform_machine != "x86_64"']  # not on Intel Macs (crashes on import)   # AGPL: non-commercial prototype only; see src/recut/qc_essentia.py

[project.scripts]
recut = "recut.cli:main"

[tool.recut]
pipeline = "modal"          # "modal" — more options added as needed
analysis_output = "temp/analysis"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore:.*is deprecated. use plan v2:DeprecationWarning"]

[tool.ruff]
line-length = 100
exclude = ["src/analysis/models"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (unused imports, undefined names)
    "I",   # isort (import ordering)
]
ignore = [
    "E501",  # line too long — handled by formatter
]
