[project]
name = "recut"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "librosa",
    "scipy",
    "pedalboard",
    "modal",
    "pydantic",
    "soundfile",
    "fastapi",
    "uvicorn",
    "python-multipart",
    "pyloudnorm",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "httpx"]
qc = ['essentia; not (sys_platform == "darwin" and platform_machine == "x86_64")']   # AGPL: non-commercial prototype only; see src/recut/qc_essentia.py

[project.scripts]
recut = "recut.cli:main"

[tool.recut]
pipeline = "modal"          # "modal" — more options added as needed
analysis_output = "temp/analysis"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore:.*is deprecated. use plan v2:DeprecationWarning"]

[tool.ruff]
line-length = 100
exclude = ["src/analysis/models"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (unused imports, undefined names)
    "I",   # isort (import ordering)
]
ignore = [
    "E501",  # line too long — handled by formatter
]
